# propaknews.com — HTTP only.
# Run certbot --nginx after this is live; it adds the TLS block and the
# HTTP->HTTPS redirect itself. Do not hand-write SSL directives here.

server {
    listen 80;
    listen [::]:80;
    server_name www.propaknews.com;
    return 301 http://propaknews.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name propaknews.com;

    root /var/www/propaknews;
    index index.php;

    access_log /var/log/nginx/propaknews.access.log;
    error_log  /var/log/nginx/propaknews.error.log;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120;
    }

    # Long-cache static assets
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Block access to sensitive files
    location ~ /\.(?!well-known) { deny all; }
    location = /wp-config.php { deny all; }
    location ~* /(?:uploads|files)/.*\.php$ { deny all; }
    location = /xmlrpc.php { deny all; }
}
