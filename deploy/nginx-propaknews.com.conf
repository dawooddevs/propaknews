# propaknews.com — HTTP only.
# Run certbot --nginx after this is live; it adds TLS and the HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name www.propaknews.com;
    return 301 http://propaknews.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name propaknews.com;

    access_log /var/log/nginx/propaknews.access.log;
    error_log  /var/log/nginx/propaknews.error.log;
    client_max_body_size 32M;

    location /_astro/ {
        alias /var/www/propaknews/dist/client/_astro/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /uploads/ {
        alias /var/www/propaknews/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
