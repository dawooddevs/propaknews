# propaknews.com — TLS via certbot (the "managed by Certbot" lines were added by certbot --nginx).
# Run certbot --nginx after this is live; it adds TLS and the HTTPS redirect.

server {
    server_name www.propaknews.com;
    return 301 https://propaknews.com$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/propaknews.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/propaknews.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name propaknews.com;

    access_log /var/log/nginx/propaknews.access.log;
    error_log  /var/log/nginx/propaknews.error.log;
    client_max_body_size 32M;

    location /_astro/ {
        alias /var/www/propaknews/dist/client/_astro/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /uploads/ {
        alias /var/www/propaknews/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/propaknews.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/propaknews.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = propaknews.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name propaknews.com;
    return 404; # managed by Certbot


}

server {
    if ($host = www.propaknews.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.propaknews.com;
    return 404; # managed by Certbot


}
